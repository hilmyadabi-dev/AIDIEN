<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" class="aksara-svg-map" id="nusantara-map-svg" role="img" aria-label="Peta Interaktif Kepulauan Indonesia">
  <defs>
    <!-- Map Gradients -->
    <linearGradient id="ocean-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C39E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F5E5C0" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="island-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#442F23" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-active" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#DAA520" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Lat/Long Grid Lines (Editorial Cartography style) -->
  <g class="map-grid" stroke="#442F23" stroke-opacity="0.08" stroke-dasharray="3,6" stroke-width="1">
    <line x1="50" y1="120" x2="1150" y2="120" />
    <line x1="50" y1="250" x2="1150" y2="250" />
    <line x1="50" y1="380" x2="1150" y2="380" />
    <line x1="220" y1="50" x2="220" y2="450" />
    <line x1="450" y1="50" x2="450" y2="450" />
    <line x1="720" y1="50" x2="720" y2="450" />
    <line x1="960" y1="50" x2="960" y2="450" />
  </g>

  <!-- Compass Rose -->
  <g class="map-compass" transform="translate(1080, 80) scale(0.65)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#B66E41" stroke-width="1.5" stroke-dasharray="2,3"/>
    <polygon points="40,6 46,36 40,32 34,36" fill="#D36228"/>
    <polygon points="40,74 46,44 40,48 34,44" fill="#442F23"/>
    <polygon points="6,40 36,46 32,40 36,34" fill="#442F23"/>
    <polygon points="74,40 44,46 48,40 44,34" fill="#442F23"/>
    <text x="40" y="-2" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="16" fill="#D36228">U</text>
  </g>

  <!-- REGION 1: SUMATERA -->
  <g id="region-sumatera" class="map-region-group" data-region="sumatera" tabindex="0" role="button" aria-label="Wilayah Sumatera">
    <!-- Sumatera Mainland -->
    <path class="island-path" d="M 120,95 Q 145,130 180,185 Q 210,230 255,280 Q 285,320 315,350 Q 325,355 330,345 Q 315,320 285,260 Q 255,200 220,150 Q 180,110 140,85 Z" />
    <!-- Nias, Mentawai, Bangka Belitung -->
    <circle class="island-small" cx="130" cy="205" r="5" />
    <circle class="island-small" cx="160" cy="255" r="6" />
    <circle class="island-small" cx="185" cy="295" r="7" />
    <circle class="island-small" cx="305" cy="285" r="10" />
    <circle class="island-small" cx="335" cy="295" r="8" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(210, 190)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">SUMATERA</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Rumah Gadang • Tari Saman</text>
    </g>
  </g>

  <!-- REGION 2: JAWA -->
  <g id="region-jawa" class="map-region-group" data-region="jawa" tabindex="0" role="button" aria-label="Wilayah Jawa">
    <!-- Jawa Mainland -->
    <path class="island-path" d="M 335,370 Q 380,365 440,360 Q 510,360 575,370 Q 600,380 595,395 Q 560,395 490,395 Q 410,400 350,395 Q 330,390 335,370 Z" />
    <!-- Madura -->
    <ellipse class="island-small" cx="575" cy="360" rx="20" ry="7" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(460, 395)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">JAWA</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Batik Megamendung • Wayang Kulit</text>
    </g>
  </g>

  <!-- REGION 3: BALI & NUSA TENGGARA -->
  <g id="region-bali-nusa" class="map-region-group" data-region="bali-nusa" tabindex="0" role="button" aria-label="Wilayah Bali dan Nusa Tenggara">
    <!-- Bali -->
    <ellipse class="island-small" cx="620" cy="385" rx="14" ry="9" />
    <!-- Lombok -->
    <ellipse class="island-small" cx="650" cy="387" rx="13" ry="9" />
    <!-- Sumbawa -->
    <path class="island-path" d="M 675,380 Q 700,378 720,385 Q 710,395 680,392 Z" />
    <!-- Flores -->
    <path class="island-path" d="M 740,380 Q 775,375 810,380 Q 805,390 750,390 Z" />
    <!-- Sumba -->
    <ellipse class="island-small" cx="745" cy="415" rx="18" ry="10" />
    <!-- Timor (West) & Rote -->
    <path class="island-path" d="M 820,395 Q 850,385 865,400 Q 850,420 825,410 Z" />
    <circle class="island-small" cx="810" cy="430" r="6" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(710, 420)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">BALI & NUSA TENGGARA</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Tari Legong • Sasando Rote</text>
    </g>
  </g>

  <!-- REGION 4: KALIMANTAN -->
  <g id="region-kalimantan" class="map-region-group" data-region="kalimantan" tabindex="0" role="button" aria-label="Wilayah Kalimantan">
    <!-- Kalimantan Mainland (Indonesian Sector) -->
    <path class="island-path" d="M 390,210 Q 420,165 470,165 Q 520,170 540,210 Q 560,250 560,300 Q 520,335 460,330 Q 410,320 380,280 Q 375,245 390,210 Z" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(465, 240)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">KALIMANTAN</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Mandau Dayak • Rumah Betang</text>
    </g>
  </g>

  <!-- REGION 5: SULAWESI -->
  <g id="region-sulawesi" class="map-region-group" data-region="sulawesi" tabindex="0" role="button" aria-label="Wilayah Sulawesi">
    <!-- Sulawesi Characteristic K-Shape -->
    <path class="island-path" d="M 640,165 Q 675,150 710,160 Q 695,180 660,185 Q 640,210 655,235 Q 685,240 715,260 Q 710,275 670,270 Q 645,280 650,330 Q 630,345 625,320 Q 625,270 610,240 Q 605,200 640,165 Z" />
    <!-- Buton & Muna -->
    <circle class="island-small" cx="665" cy="340" r="8" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(645, 220)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">SULAWESI</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Tongkonan Toraja • Perahu Phinisi</text>
    </g>
  </g>

  <!-- REGION 6: MALUKU -->
  <g id="region-maluku" class="map-region-group" data-region="maluku" tabindex="0" role="button" aria-label="Wilayah Maluku">
    <!-- Halmahera -->
    <path class="island-path" d="M 770,160 Q 790,145 795,170 Q 780,190 800,205 Q 780,215 765,190 Z" />
    <!-- Seram & Ambon -->
    <ellipse class="island-small" cx="800" cy="275" rx="28" ry="10" transform="rotate(-10, 800, 275)" />
    <!-- Buru -->
    <ellipse class="island-small" cx="745" cy="275" rx="15" ry="11" />
    <!-- Banda & Kei & Aru Islands -->
    <circle class="island-small" cx="810" cy="320" r="5" />
    <circle class="island-small" cx="850" cy="340" r="7" />
    <circle class="island-small" cx="880" cy="340" r="9" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(780, 290)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">MALUKU</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Tari Cakalele • Kain Tenun Tanimbar</text>
    </g>
  </g>

  <!-- REGION 7: PAPUA -->
  <g id="region-papua" class="map-region-group" data-region="papua" tabindex="0" role="button" aria-label="Wilayah Papua">
    <!-- Papua (Bird's Head + Mainland West Papua) -->
    <path class="island-path" d="M 870,220 Q 900,195 930,225 Q 920,240 890,245 Q 910,260 970,260 Q 1060,260 1100,270 Q 1110,340 1080,380 Q 1020,380 970,335 Q 940,305 910,285 Q 860,250 870,220 Z" />
    <!-- Biak & Yapen -->
    <ellipse class="island-small" cx="950" cy="210" rx="14" ry="5" />
    <ellipse class="island-small" cx="960" cy="225" rx="20" ry="6" />
    <!-- Raja Ampat Islands -->
    <circle class="island-small" cx="850" cy="205" r="6" />
    <circle class="island-small" cx="840" cy="225" r="5" />
    <!-- Marker & Label -->
    <g class="region-pin" transform="translate(1010, 290)">
      <circle class="pin-ring" cx="0" cy="0" r="12" />
      <circle class="pin-dot" cx="0" cy="0" r="4" />
      <text class="pin-label" x="0" y="24" text-anchor="middle">PAPUA</text>
      <text class="pin-sub" x="0" y="36" text-anchor="middle">Noken Tradisional • Seni Ukir Asmat</text>
    </g>
  </g>
</svg>
